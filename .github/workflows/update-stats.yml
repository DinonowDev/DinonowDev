name: Update Profile Stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "Curtain character"
        required: false
        default: ""
        type: choice
        options: ["", "random", "cat", "spiderman"]
  push:
    branches: [main]
    paths:
      - "scripts/generate-cards.mjs"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # CARD_THEME: set the repository variable (Settings -> Secrets and
      # variables -> Actions -> Variables) to "cat" or "spiderman" to pin a
      # character. Leave it unset for a random pick on every run.
      - name: Generate SVG card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: DinonowDev
          CARD_THEME: ${{ inputs.theme || vars.CARD_THEME }}
          # The runner gets its own API quota, so never fall back to the snapshot here.
          USE_MOCK: "0"
        run: node scripts/generate-cards.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-card.svg
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile stats card"
            git push
          fi
