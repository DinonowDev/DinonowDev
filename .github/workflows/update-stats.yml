name: Update Profile Stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "Curtain character"
        required: false
        default: ""
        type: choice
        options: ["", "random", "cat", "spiderman", "batman"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout card generator
        uses: actions/checkout@v4
        with:
          repository: DinonowDev/github-profile-landing
          path: .card-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate live SVG card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: DinonowDev
          CARD_THEME: ${{ inputs.theme || vars.CARD_THEME }}
          USE_MOCK: "0"
        run: |
          node .card-src/scripts/generate-cards.mjs
          mkdir -p assets
          cp .card-src/assets/profile-card.svg assets/profile-card.svg

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-card.svg
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile stats card"
            git push
          fi
